<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Management System</title>
  <style>
    :root{
  --bg:#0a0b0d;
  --panel:#111318;
  --panel2:#0d0f14;
  --border:#1f2937;
  --border2:#161920;
  --text:#e5e7eb;
  --muted:#4b5563;
  --muted2:#374151;
  --blue:#3b82f6;
  --blue2:#1e3a5f;
  --green:#10b981;
  --amber:#f59e0b;
  --purple:#8b5cf6;
  --red:#f87171;
  --font:'Courier New', monospace;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
}

button, input, select{
  font-family:inherit;
}

a{ color:inherit; }

/* LOGIN */
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.grid-bg{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size:40px 40px;
}

.radial-1{
  position:absolute;
  top:20%;
  left:10%;
  width:300px;
  height:300px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
}
.radial-2{
  position:absolute;
  bottom:15%;
  right:10%;
  width:400px;
  height:400px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(16,185,129,0.06) 0%, transparent 70%);
}

.login-inner{
  position:relative;
  width:420px;
  z-index:2;
}

.logo{
  text-align:center;
  margin-bottom:40px;
}

.logo-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:8px;
}

.logo-box{
  width:36px;
  height:36px;
  background:#1e3a5f;
  border:2px solid var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.logo-title{
  color:var(--text);
  font-size:20px;
  letter-spacing:0.15em;
  font-weight:bold;
  text-transform:uppercase;
}

.logo-badge{
  color:var(--blue);
  font-size:10px;
  letter-spacing:0.2em;
  padding:2px 6px;
  border:1px solid var(--blue);
  text-transform:uppercase;
}

.logo-sub{
  color:var(--muted);
  font-size:11px;
  letter-spacing:0.15em;
  text-transform:uppercase;
  margin:0;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  padding:36px 40px;
}

.field{
  margin-bottom:28px;
}

.label{
  color:#9ca3af;
  font-size:10px;
  letter-spacing:0.15em;
  text-transform:uppercase;
  margin-bottom:8px;
}

.input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  border-left:3px solid var(--blue);
  color:var(--text);
  padding:10px 14px;
  font-size:13px;
  outline:none;
}

.btn-primary{
  width:100%;
  background:var(--blue2);
  border:1px solid var(--blue);
  color:#93c5fd;
  padding:12px;
  font-size:12px;
  letter-spacing:0.15em;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .2s;
}
.btn-primary:hover{
  background:#2563eb;
}

.error{
  color:var(--red);
  font-size:12px;
  margin-bottom:20px;
  padding:8px 12px;
  background:rgba(248,113,113,0.08);
  border:1px solid rgba(248,113,113,0.2);
}

.demo{
  margin-top:24px;
  padding:16px 20px;
  background:rgba(255,255,255,0.02);
  border:1px solid var(--border);
}

.demo-title{
  color:var(--muted);
  font-size:10px;
  letter-spacing:0.15em;
  text-transform:uppercase;
  margin-bottom:12px;
}

.demo-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  cursor:pointer;
  padding:5px 8px;
}
.demo-row:hover{
  background:rgba(255,255,255,0.04);
}

.demo-label{
  font-size:10px;
  letter-spacing:0.12em;
  min-width:70px;
}
.demo-email{
  color:var(--muted);
  font-size:10px;
}

/* APP LAYOUT */
.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 20px;
  height:52px;
  flex-shrink:0;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-right:auto;
}

.icon-btn{
  background:none;
  border:none;
  color:var(--muted);
  cursor:pointer;
  font-size:16px;
  padding:4px 8px;
}

.brand-box{
  width:24px;
  height:24px;
  background:var(--blue2);
  border:1px solid var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

.brand-name{
  color:var(--text);
  font-size:14px;
  letter-spacing:0.12em;
  font-weight:bold;
}

.brand-tag{
  color:var(--blue);
  font-size:9px;
  padding:1px 5px;
  border:1px solid var(--blue);
  letter-spacing:0.1em;
}

.user-area{
  display:flex;
  align-items:center;
  gap:16px;
}

.user-meta{
  text-align:right;
}
.user-name{
  color:var(--text);
  font-size:12px;
}
.user-role{
  color:var(--muted);
  font-size:10px;
  letter-spacing:0.1em;
}

.avatar{
  width:32px;
  height:32px;
  background:var(--blue2);
  border:1px solid var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#93c5fd;
  font-size:11px;
  font-weight:bold;
}

.btn-ghost{
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  padding:5px 12px;
  font-size:10px;
  letter-spacing:0.1em;
  cursor:pointer;
  text-transform:uppercase;
}
.btn-ghost:hover{
  color:var(--text);
}

.main-row{
  display:flex;
  flex:1;
  overflow:hidden;
}

.sidebar{
  background:var(--panel2);
  border-right:1px solid var(--border);
  flex-shrink:0;
  transition:width .2s;
  overflow:hidden;
  position:relative;
}

.sidebar-inner{
  padding:16px;
}

.sidebar.collapsed .sidebar-inner{
  padding:16px 8px;
}

.navbtn{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 8px;
  margin-bottom:2px;
  background:none;
  border:1px solid transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:10px;
  letter-spacing:0.12em;
  text-align:left;
  white-space:nowrap;
}

.navbtn.active{
  background:#1e2d42;
  border:1px solid #2a3f5f;
  color:#93c5fd;
}

.navicon{
  font-size:14px;
  min-width:18px;
}

.secure-box{
  padding:10px;
  background:rgba(16,185,129,0.06);
  border:1px solid rgba(16,185,129,0.2);
}

.secure-title{
  color:var(--green);
  font-size:10px;
  letter-spacing:0.1em;
  margin-bottom:4px;
}

.secure-sub{
  color:var(--muted);
  font-size:9px;
  line-height:1.5;
}

.content{
  flex:1;
  overflow:auto;
  padding:24px;
}

.h1{
  color:var(--text);
  font-size:16px;
  letter-spacing:0.15em;
  text-transform:uppercase;
  margin:0 0 4px;
}

.sub{
  color:var(--muted);
  font-size:11px;
  letter-spacing:0.1em;
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:24px;
}

.stat{
  background:var(--panel);
  border:1px solid var(--border);
  padding:16px 20px;
}

.stat-value{
  font-size:28px;
  font-weight:bold;
  line-height:1;
}

.stat-label{
  color:var(--muted);
  font-size:10px;
  letter-spacing:0.12em;
  margin-top:6px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  padding:20px;
}

.panel-title{
  color:#9ca3af;
  font-size:10px;
  letter-spacing:0.15em;
  text-transform:uppercase;
  margin-bottom:16px;
}

/* FILTERS */
.filters{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.select{
  background:var(--panel);
  border:1px solid var(--border);
  color:#9ca3af;
  padding:8px 14px;
  font-size:11px;
  outline:none;
}

.search{
  flex:1;
  background:var(--panel);
  border:1px solid var(--border);
  border-left:3px solid var(--blue);
  color:var(--text);
  padding:8px 14px;
  font-size:12px;
  outline:none;
}

/* TABLE */
.table{
  background:var(--panel);
  border:1px solid var(--border);
}

.thead{
  display:grid;
  grid-template-columns:40px 1fr 80px 80px 70px 80px 100px 80px;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
}

.th{
  color:var(--muted2);
  font-size:9px;
  letter-spacing:0.12em;
}

.trow{
  display:grid;
  grid-template-columns:40px 1fr 80px 80px 70px 80px 100px 80px;
  padding:12px 16px;
  border-bottom:1px solid var(--border2);
  cursor:pointer;
  align-items:center;
  transition:background .1s;
}
.trow:hover{
  background:#131620;
}
.trow.selected{
  background:#161d2b;
}

.doc-title{
  color:#d1d5db;
  font-size:12px;
  margin-bottom:3px;
}
.doc-dept{
  font-size:10px;
  letter-spacing:0.1em;
}
.small{
  color:var(--muted2);
  font-size:10px;
}
.version{
  color:var(--blue);
  font-size:10px;
  letter-spacing:0.1em;
}

.row-actions{
  display:flex;
  gap:4px;
}

.btn-mini{
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  padding:3px 8px;
  font-size:9px;
  cursor:pointer;
}

.btn-mini-danger{
  background:none;
  border:1px solid #2a1515;
  color:#6b3030;
  padding:3px 6px;
  font-size:9px;
  cursor:pointer;
}

.doc-detail{
  margin-top:16px;
  background:var(--panel);
  border:1px solid var(--border);
  padding:20px;
}

.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.badge{
  font-size:10px;
  padding:2px 8px;
  border:1px solid var(--border);
  color:var(--muted);
}

.tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.tag{
  color:var(--muted);
  font-size:10px;
  padding:2px 8px;
  border:1px solid var(--border);
  letter-spacing:0.08em;
}

.btn-action{
  background:#0a1628;
  border:1px solid #1e3a5f;
  color:#60a5fa;
  padding:8px 16px;
  font-size:10px;
  letter-spacing:0.1em;
  cursor:pointer;
}

.btn-ack{
  background:#1a2a12;
  border:1px solid #4ade80;
  color:#4ade80;
  padding:8px 16px;
  font-size:10px;
  letter-spacing:0.1em;
  cursor:pointer;
}

.ack-ok{
  color:#4ade80;
  font-size:10px;
  padding:8px 0;
  letter-spacing:0.1em;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.modal-card{
  background:var(--panel);
  border:1px solid var(--border);
  width:460px;
  padding:28px 32px;
}

.modal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.modal-title{
  color:var(--text);
  font-size:13px;
  letter-spacing:0.12em;
  text-transform:uppercase;
}

.dropzone{
  margin-bottom:20px;
  padding:16px;
  background:var(--panel2);
  border:1px dashed var(--border);
  text-align:center;
}

.drop-main{
  color:var(--muted2);
  font-size:11px;
  letter-spacing:0.1em;
}

.drop-sub{
  color:var(--border);
  font-size:10px;
  margin-top:4px;
}

.btn-row{
  display:flex;
  gap:10px;
}

.btn-cancel{
  flex:1;
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  padding:10px;
  font-size:10px;
  letter-spacing:0.1em;
  cursor:pointer;
}

.btn-upload{
  flex:2;
  background:var(--blue2);
  border:1px solid var(--blue);
  color:#93c5fd;
  padding:10px;
  font-size:10px;
  letter-spacing:0.1em;
  cursor:pointer;
}

.success{
  text-align:center;
  padding:20px 0;
}

.success-check{
  color:#4ade80;
  font-size:24px;
  margin-bottom:8px;
}

.success-text{
  color:#4ade80;
  font-size:12px;
  letter-spacing:0.12em;
}

/* MOBILE */
@media (max-width: 1000px){
  .grid4{ grid-template-columns:repeat(2,1fr); }
  .grid2{ grid-template-columns:1fr; }
  .thead, .trow{
    grid-template-columns:40px 1fr 70px 70px 0 0 0 80px;
  }
  .thead div:nth-child(5),
  .thead div:nth-child(6),
  .thead div:nth-child(7),
  .trow div:nth-child(5),
  .trow div:nth-child(6),
  .trow div:nth-child(7){
    display:none;
  }
}
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ===================== DATA =====================
    const USERS = {
      "admin@company.com": { role: "IT Admin", name: "Alex Mitchell", password: "password123", avatar: "AM" },
      "hr@company.com": { role: "HR Admin", name: "Sarah Chen", password: "password123", avatar: "SC" },
      "john.doe@company.com": { role: "Employee", name: "John Doe", password: "password123", avatar: "JD" },
    };

    const DOCUMENTS = [
      { id: 1, title: "Employee Handbook 2025", dept: "HR", type: "Policy", version: "v3.2", date: "2025-01-15", tags: ["onboarding", "policy"], size: "2.4 MB", views: 142, status: "active", requiresAck: true },
      { id: 2, title: "IT Security Guidelines", dept: "IT", type: "Security", version: "v2.1", date: "2025-02-01", tags: ["security", "compliance"], size: "1.8 MB", views: 87, status: "active", requiresAck: true },
      { id: 3, title: "Remote Work Policy", dept: "HR", type: "Policy", version: "v1.5", date: "2025-01-28", tags: ["remote", "policy"], size: "890 KB", views: 211, status: "active", requiresAck: false },
      { id: 4, title: "Data Retention Schedule", dept: "Legal", type: "Compliance", version: "v4.0", date: "2024-12-10", tags: ["compliance", "legal"], size: "3.1 MB", views: 56, status: "active", requiresAck: true },
      { id: 5, title: "Benefits Enrollment Guide", dept: "HR", type: "Guide", version: "v2.3", date: "2025-01-05", tags: ["benefits", "enrollment"], size: "5.2 MB", views: 334, status: "active", requiresAck: false }
    ];

    const deptColors = { HR: "#3b82f6", IT: "#10b981", Legal: "#f59e0b", Finance: "#8b5cf6" };
    const typeIcons = { Policy: "⬡", Security: "⬢", Compliance: "⬣", Guide: "◈", Procedure: "◇" };

    let screen = "login";
    let user = null;
    let email="", password="", loginError="";
    let activeNav="documents", search="", filterDept="All", filterType="All";
    let selectedDoc = null, acknowledged = new Set();
    let uploadModal=false, uploadName="", uploadDept="HR", uploadType="Policy", uploadSuccess=false;
    let docs = [...DOCUMENTS];
    let sidebarCollapsed = false;

    function isAdmin() { return user && (user.role==="IT Admin" || user.role==="HR Admin"); }

    function filteredDocs() {
      return docs.filter(d=>{
        const matchSearch = d.title.toLowerCase().includes(search.toLowerCase()) || d.tags.some(t=>t.toLowerCase().includes(search.toLowerCase()));
        const matchDept = filterDept==="All" || d.dept===filterDept;
        const matchType = filterType==="All" || d.type===filterType;
        return matchSearch && matchDept && matchType && d.status==="active";
      });
    }

    function handleLogin() {
      const found = USERS[email];
      if(found && found.password===password){ user={...found,email}; screen="app"; loginError=""; render();}
      else{ loginError="Invalid credentials. Please try again."; render();}
    }

    function handleLogout(){ user=null; screen="login"; email=""; password=""; loginError=""; activeNav="documents"; render(); }

    function handleUpload(){
      if(!uploadName.trim()) return;
      const newDoc = { id: docs.length+1, title: uploadName, dept: uploadDept, type: uploadType, version:"v1.0", date:new Date().toISOString().split("T")[0], tags:[uploadDept.toLowerCase(),uploadType.toLowerCase()], size:"1 MB", views:0, status:"active", requiresAck:false };
      docs=[newDoc,...docs]; uploadSuccess=true; render();
      setTimeout(()=>{ uploadModal=false; uploadSuccess=false; uploadName=""; render(); },1500);
    }

    function renderLogin(){ return `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;">
        <h1>Login</h1>
        <input type="text" placeholder="Email" value="${email}" oninput="email=this.value">
        <input type="password" placeholder="Password" value="${password}" oninput="password=this.value">
        <button onclick="handleLogin()">Login</button>
        <div style="color:red;margin-top:8px;">${loginError}</div>
      </div>
    `;}

    function renderSidebar(){
      return `
        <button onclick="activeNav='dashboard'; render()" class="${activeNav==='dashboard'?'active':''}">Dashboard</button>
        <button onclick="activeNav='documents'; render()" class="${activeNav==='documents'?'active':''}">Documents</button>
        ${isAdmin()?`<button onclick="activeNav='audit'; render()" class="${activeNav==='audit'?'active':''}">Audit</button>`:""}
        <button onclick="handleLogout()">Logout</button>
      `;
    }

    function renderDocuments(){
      return `
        <h1 class="h1">DOCUMENTS</h1>
        <div class="sub">All uploaded documents</div>
        <div style="margin-bottom:12px;">
          <input placeholder="Search..." value="${search}" oninput="search=this.value; render()">
          <select onchange="filterDept=this.value; render()">
            <option>All</option><option>HR</option><option>IT</option><option>Legal</option><option>Finance</option>
          </select>
          <select onchange="filterType=this.value; render()">
            <option>All</option><option>Policy</option><option>Guide</option><option>Security</option><option>Compliance</option><option>Procedure</option>
          </select>
          <button onclick="uploadModal=true; render()">Upload</button>
        </div>
        <div class="table">
          ${filteredDocs().map(d=>`<div style="padding:8px;border-bottom:1px solid var(--border2);">${typeIcons[d.type]||"◇"} ${d.title} - ${d.dept} - ${d.version}</div>`).join("")}
        </div>
      `;
    }

    function renderUploadModal(){
      return `
        <div class="upload-modal">
          <div class="modal-content">
            <h2>Upload Document</h2>
            <input placeholder="Document Name" value="${uploadName}" oninput="uploadName=this.value">
            <select onchange="uploadDept=this.value">
              <option>HR</option><option>IT</option><option>Legal</option><option>Finance</option>
            </select>
            <select onchange="uploadType=this.value">
              <option>Policy</option><option>Guide</option><option>Security</option><option>Compliance</option><option>Procedure</option>
            </select>
            <button onclick="handleUpload()">Upload</button>
          </div>
        </div>
      `;
    }

    function renderTopbar(){ return `<div class="topbar">DMS - Welcome ${user.name}</div>`; }
    function renderDashboard(){ return `<h1 class="h1">Dashboard</h1>`; }
    function renderAudit(){ return `<h1 class="h1">Audit (Admin Only)</h1>`; }

    function render(){ document.getElementById("app").innerHTML = screen==="login"?renderLogin():`
      <div class="app">
        ${renderTopbar()}
        <div class="main-row">
          <div class="sidebar ${sidebarCollapsed?'collapsed':''}" style="width:${sidebarCollapsed?52:200}px">${renderSidebar()}</div>
          <div class="content">
            ${activeNav==='dashboard'?renderDashboard():''}
            ${activeNav==='documents'?renderDocuments():''}
            ${activeNav==='audit' && isAdmin()?renderAudit():''}
          </div>
        </div>
        ${uploadModal?renderUploadModal():''}
      </div>
    `;}
    
    render();
  </script>
</body>
</html>
