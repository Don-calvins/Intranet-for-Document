<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        h2 {
            color: #007bff;
        }
        .admin-controls {
            border: 1px dashed #007bff;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        button {
            padding: 5px 10px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .edit-button {
            background-color: red;
        }
        .edit-button:hover {
            background-color: darkred;
        }
        #pdfViewer {
            display: none;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="pdfViewer"></div>
    <script>
        let token = null;

        async function register(username, password) {
            const response = await fetch('http://localhost:5000/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            return response.ok;
        }

        async function login(username, password) {
            const response = await fetch('http://localhost:5000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (response.ok) {
                const data = await response.json();
                token = data.token;
                loadDocuments();
            } else {
                alert('Login failed');
            }
        }

        async function uploadDocument(file) {
            const formData = new FormData();
            formData.append('document', file);

            const response = await fetch('http://localhost:5000/api/upload', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            return response.ok;
        }

        async function loadDocuments() {
            const response = await fetch('http://localhost:5000/api/documents', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const documents = await response.json();
            renderDocuments(documents);
        }

        function renderDocuments(documents) {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = `
                <h2>Official Company Intranet</h2>
                <input type="file" id="fileInput" />
                <button onclick="handleUpload()">Upload Document</button>
                <table>
                    <thead>
                        <tr>
                            <th>Document Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${documents.map(doc => `
                            <tr>
                                <td>${doc.title}</td>
                                <td>
                                    <button onclick="viewDocument('${doc.title}')">View</button>
                                    <button onclick="downloadDocument('${doc.title}')">Download</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function handleUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            uploadDocument(file).then(success => {
                if (success) {
                    alert('Upload successful');
                    loadDocuments();
                } else {
                    alert('Upload failed');
                }
            });
        }

        function viewDocument(title) {
            const pdfViewer = document.getElementById('pdfViewer');
            pdfViewer.innerHTML = ''; // Clear previous content
            pdfViewer.style.display = 'block'; // Show viewer

            const loadingTask = pdfjsLib.getDocument(`http://localhost:5000/${title}`);
            loadingTask.promise.then(pdf => {
                pdf.getPage(1).then(page => {
                    const scale = 1.5;
                    const viewport = page.getViewport({ scale: scale });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    pdfViewer.appendChild(canvas);

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    page.render(renderContext);
                });
            });
        }

        function downloadDocument(title) {
            const link = document.createElement('a');
            link.href = `http://localhost:5000/${title}`;
            link.download = title;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Example usage
        // Uncomment to test login or registration
        // login('username', 'password');
        // register('newuser', 'password');
    </script>
</body>
</html>
